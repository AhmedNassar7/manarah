<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Qibla compass motion preview</title>
  <circle cx="32" cy="32" r="22" fill="#dce6e0"/>

  <circle cx="32" cy="32" r="22" fill="none" stroke="#b08d3e" stroke-width="2" opacity="0">
    <animate attributeName="r" values="16;30" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </circle>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#b08d3e" stroke-width="2" opacity="0">
    <animate attributeName="r" values="16;30" dur="1.4s" begin="0.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.4s" begin="0.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </circle>

  <g stroke="#1e5c55" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="16">
      <animateTransform attributeName="transform" type="rotate" values="-8 32 32; 6 32 32; -8 32 32" dur="2.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 1.56 0.64 1"/>
    </line>
  </g>
  <circle cx="32" cy="32" r="3.5" fill="#1e5c55"/>
</svg>
